<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн Запис</title>
    <style>
        :root { 
            --main-glow: #ffffff; 
            --text-light: #f5f5f7; 
            --bg-glass: rgba(15, 15, 15, 0.88); 
        }
             body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            /* ХУЯК! Жестко лочим картинку в оригинальном размере по центру, запрещая растягивание на ПК! */
            background: #1e1e1e url('bg.jpeg') no-repeat center center fixed;
            background-size: contain; /* Картинка сжимается и держит 100% свою четкость и пропорции! */
            
            color: var(--text-light); 
            padding: 20px; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            justify-content: center;
            box-sizing: border-box;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.35); /* М'яка люксова вуаль */
            z-index: -1;
        }
                /* ХУЯК! Картка стає повністю еластичною, адаптивною і м'яко стискається на будь-якому телефоні! */
        .card { 
            background: var(--bg-glass); 
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 5vw; /* Динамічні відступи: самі зменшуються на малих екранах! */
            border-radius: 32px; 
            box-shadow: 0 40px 90px rgba(0,0,0,0.85); 
            max-width: 520px; 
            width: 90%; /* Жорстко лочимо гумову ширину, щоб картка ніколи не вилазила за краї! */
            box-sizing: border-box; 
            border: 1px solid rgba(255,255,255,0.12);
            z-index: 1;
            transition: all 0.3s ease;
        }
        /* Обмеження для великих ПК-моніторів, щоб на комп'ютері відступи не розпирало */
        @media (min-width: 768px) {
            .card { 
                padding: 45px; 
                transform: scale(1.02); 
            } 
        }

        @media (min-width: 768px) {
            .card { transform: scale(1.02); } 
        }
        h2 { 
            text-align: center; 
            color: #ffffff; 
            margin-top: 0; 
            font-weight: 300; 
            letter-spacing: 4px;
            text-transform: uppercase;
            font-size: 22px;
            text-shadow: 0 0 15px rgba(255,255,255,0.5);
            margin-bottom: 30px;
        }
        .step { display: none; }
        .step.active { display: block; }
        
        .btn { 
            background: none;
            color: white; 
            border: 1px solid rgba(255,255,255,0.4); 
            padding: 18px; 
            width: 100%; 
            border-radius: 16px; 
            font-size: 16px; 
            font-weight: 500; 
            cursor: pointer; 
            margin-top: 15px; 
            transition: all 0.3s ease; 
            box-sizing: border-box;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .btn:hover { 
            background: white;
            color: #111111;
            box-shadow: 0 0 30px rgba(255,255,255,0.9);
            border-color: white;
        }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 25px; }
        
        .slot-btn { 
            border: 1px solid rgba(255,255,255,0.25); 
            background: rgba(0, 0, 0, 0.6); 
            color: var(--text-light); 
            padding: 16px; 
            border-radius: 14px; 
            text-align: center; 
            cursor: pointer; 
            font-weight: 600; 
            transition: all 0.2s ease;
            letter-spacing: 1px;
            font-size: 18px;
        }
        .slot-btn:hover {
            border-color: white;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }
        .slot-btn.selected { 
            background: white; 
            color: #111111; 
            border-color: white;
            box-shadow: 0 0 25px rgba(255,255,255,1);
        }
        input { 
            width: 100%; 
            padding: 18px; 
            margin-top: 15px; 
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 14px; 
            box-sizing: border-box; 
            font-size: 17px; 
            color: white;
            transition: 0.3s;
        }
        input:focus {
            outline: none;
            border-color: white;
            box-shadow: 0 0 12px rgba(255,255,255,0.4);
        }
        .loading { text-align: center; font-weight: 300; color: #aaa; letter-spacing: 1px; font-size: 16px; }
        p { font-size: 16px; color: #bbb; letter-spacing: 0.5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Онлайн Запис</h2>
    
    <!-- КРОК 1: Вибір Дати -->
    <div id="step1" class="step active">
        <div id="loading" class="loading">Шукаємо вільні вікна</div>
        <div id="date-container"></div>
    </div>

    <!-- КРОК 2: Вибір Часу -->
    <div id="step2" class="step">
        <p style="text-align:center; font-weight:400;">Обери час на <span id="selected-date-txt" style="color:white;font-weight:600;"></span>:</p>
        <div id="slots-grid" class="grid"></div>
        <button class="btn" onclick="prevStep(1)" style="margin-top:25px; background:rgba(0,0,0,0.5); border-color:rgba(255,255,255,0.2);">⬅️ Назад</button>
    </div>

    <!-- КРОК 3: Введення Даних Клієнтки -->
    <div id="step3" class="step">
        <p style="text-align:center; font-weight:400;">Фінал! Введи свої дані:</p>
        <input type="text" id="client-name" placeholder="Твоє ім'я" required>
        <input type="tel" id="client-phone" placeholder="Номер телефону" required>
        <button class="btn" onclick="submitBooking()">🎉 Підтвердити Запис</button>
        <button class="btn" style="background:rgba(0,0,0,0.5); border-color:rgba(255,255,255,0.2);" onclick="prevStep(2)">⬅️ Назад</button>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx0IUUj56CEjqxUW0vMFJcwU874vKOF_WwimUHiT00J7LHVzOtmcTn_tM4_3T2aWp51iw/exec"; 
    let dbData = [];
    let bookingData = { date: "", time: "", name: "", phone: "", price: 500 }; 

    window.handleGoogleData = function(data) {
        try {
            dbData = data;
            document.getElementById("loading").style.display = "none";
            let container = document.getElementById("date-container");
            container.innerHTML = ""; 
            
            if(!dbData || dbData.length === 0) {
                container.innerHTML = "<p style='text-align:center;'>Немає вільних днів для запису ❌</p>";
                return;
            }
            
            dbData.forEach((day, index) => {
                let btn = document.createElement("button");
                btn.className = "btn";
                btn.innerText = "📅 " + day.displayDate;
                btn.onclick = () => selectDate(index);
                container.appendChild(btn);
            });
        } catch(err) {
            document.getElementById("loading").innerText = "Помилка структури бази даних ❌";
        }
    }

    function loadSlotsJSONP() {
        let script = document.createElement("script");
        script.src = API_URL + "?callback=handleGoogleData";
        document.body.appendChild(script);
    }

    function selectDate(index) {
        let day = dbData[index];
        bookingData.date = day.date;
        document.getElementById("selected-date-txt").innerText = day.displayDate;
        
        let grid = document.getElementById("slots-grid");
        grid.innerHTML = "";
        
        day.slots.forEach(slot => {
            let div = document.createElement("div");
            div.className = "slot-btn";
            div.innerText = slot;
            div.onclick = () => {
                document.querySelectorAll(".slot-btn").forEach(el => el.classList.remove("selected"));
                div.classList.add("selected");
                bookingData.time = slot;
                setTimeout(() => nextStep(3), 300);
            };
            grid.appendChild(div);
        });
        nextStep(2);
    }

    function nextStep(stepNum) {
        document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
        document.getElementById("step" + stepNum).classList.add("active");
    }

    function prevStep(stepNum) {
        nextStep(stepNum);
    }

    async function submitBooking() {
        bookingData.name = document.getElementById("client-name").value;
        bookingData.phone = document.getElementById("client-phone").value;
        
        if(!bookingData.name || !bookingData.phone) {
            alert("Введи ім'я та телефон, красуне! 💕");
            return;
        }
        
        document.getElementById("step3").innerHTML = "<div class='loading'>Записуємо в базу... Зачекайте...</div>";
        
        try {
            await fetch(API_URL, {
                method: "POST",
                mode: "no-cors", 
                body: JSON.stringify(bookingData)
            });
            
            // ХУЯК! Додаємо соковитий люксовий текст РАЗОМ із кнопкою повернення на головний екран!
            document.getElementById("step3").innerHTML = `
                <h3 style='text-align:center;color:#fff;text-shadow: 0 0 10px rgba(255,255,255,0.5);margin-bottom:20px;'>🎉 Ти успішно записана!<br><span style='font-size:14px;color:#ccc;'>Майстер чекає на тебе! Дякуємо! 💕</span></h3>
                <button class="btn" onclick="window.location.reload();" style="background:rgba(255,255,255,0.15); border-color:rgba(255,255,255,0.3);">⬅️ Повернутись на головну</button>
            `;
        } catch(e) {
            document.getElementById("step3").innerHTML = `
                <h3 style='text-align:center;color:#fff;text-shadow: 0 0 10px rgba(255,255,255,0.5);margin-bottom:20px;'>🎉 Ти успішно записана!<br><span style='font-size:14px;color:#ccc;'>Майстер чекає на тебе! Дякуємо! 💕</span></h3>
                <button class="btn" onclick="window.location.reload();" style="background:rgba(255,255,255,0.15); border-color:rgba(255,255,255,0.3);">⬅️ Повернутись на головну</button>
            `;
        }
    }
        loadSlotsJSONP();
</script>
</body>
</html>

</script>
</body>
</html>
